map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name marathakalyanam.com www.marathakalyanam.com;

    # Let's Encrypt HTTP-01 challenge (CF must allow port 80 to origin during issuance)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marathakalyanam.com www.marathakalyanam.com;

    # certbot will populate these during install:
    ssl_certificate     /etc/letsencrypt/live/marathakalyanam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marathakalyanam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare-only access (defence-in-depth) — uncomment after first deploy:
    # set_real_ip_from 173.245.48.0/20;  # Cloudflare ranges
    # real_ip_header CF-Connecting-IP;

    client_max_body_size 12m;   # photo uploads up to 10 MB + headroom

    # API → Litestar backend
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Media (photos) → Litestar (handles passport-private auth)
    location /media/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 5m;
    }

    # GitHub deploy webhook → adnanh/webhook on :9000
    location = /hooks/deploy {
        proxy_pass http://127.0.0.1:9000/hooks/marathakalyanam-deploy;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
        proxy_read_timeout 600s;
    }

    # SvelteKit adapter-node frontend (catch-all)
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
