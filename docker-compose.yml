services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marathakalyanam
      POSTGRES_PASSWORD: marathakalyanam
      POSTGRES_DB: marathakalyanam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  pgdata:
