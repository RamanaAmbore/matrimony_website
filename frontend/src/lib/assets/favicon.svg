  <path d="M9.5 15 Q16 13 22.5 15" stroke="#C9A227" stroke-width="1" fill="none"/>
  <!-- Gold rim dots -->
  <circle cx="9.5" cy="15" r="0.8" fill="#C9A227" opacity="0.9"/>
  <circle cx="13"  cy="14" r="0.8" fill="#C9A227" opacity="0.9"/>
  <circle cx="16"  cy="13.5" r="0.8" fill="#C9A227" opacity="0.9"/>
  <circle cx="19"  cy="14" r="0.8" fill="#C9A227" opacity="0.9"/>
  <circle cx="22.5" cy="15" r="0.8" fill="#C9A227" opacity="0.9"/>
  <!-- Belly bands -->
  <path d="M7.8 21 Q16 23 24.2 21" stroke="#C9A227" stroke-width="0.6" fill="none" opacity="0.7"/>
  <path d="M7.5 25.5 Q16 27.5 24.5 25.5" stroke="#C9A227" stroke-width="0.6" fill="none" opacity="0.5"/>
  <!-- Central lotus motif -->
  <circle cx="16" cy="22" r="2.2" fill="#6B0F1A" opacity="0.25"/>
  <circle cx="16" cy="22" r="1.2" fill="#C9A227" opacity="0.5"/>
  <!-- Base plate -->
  <rect x="10" y="28.5" width="12" height="2.5" rx="1" fill="#C9A227"/>
  <rect x="8.5" y="31" width="15" height="1.5" rx="0.8" fill="#C9A227" opacity="0.6"/>
