<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify your email — MarathaKalyanam</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f9f6f1; padding:40px;">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:8px;padding:40px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <h2 style="color:#8B2500;margin-top:0;">Verify your email address</h2>
    <p>Welcome to <strong>MarathaKalyanam</strong>!</p>
    <p>Please click the button below to verify your email address and activate your account:</p>
    <div style="text-align:center;margin:32px 0;">
      <a href="http://localhost:5173/verify-email?token={{ token }}"
         style="background:#8B2500;color:#fff;padding:14px 32px;border-radius:6px;text-decoration:none;font-size:16px;font-weight:bold;">
        Verify Email
      </a>
    </div>
    <p style="color:#888;font-size:13px;">Or copy this token into the verification page:<br>
      <code style="background:#f3f0eb;padding:4px 8px;border-radius:4px;">{{ token }}</code>
    </p>
    <p style="color:#888;font-size:12px;margin-top:32px;">
      If you did not register on MarathaKalyanam, please ignore this email.
    </p>
  </div>
</body>
</html>
