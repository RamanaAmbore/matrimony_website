<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Detail Request — MarathaKalyanam Admin</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f9f6f1; padding:40px;">
  <div style="max-width:560px;margin:auto;background:#fff;border-radius:8px;padding:40px;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <h2 style="color:#1565c0;margin-top:0;">New Detail Request</h2>
    <p>A new detail request has been submitted on <strong>MarathaKalyanam</strong>.</p>
    <table style="width:100%;border-collapse:collapse;margin:16px 0;">
      <tr>
        <td style="padding:8px 12px;background:#f5f5f5;font-weight:bold;width:40%;">Requester:</td>
        <td style="padding:8px 12px;">{{ requester_name }}</td>
      </tr>
      <tr>
        <td style="padding:8px 12px;background:#f5f5f5;font-weight:bold;">Profile:</td>
        <td style="padding:8px 12px;">{{ profile_name }}</td>
      </tr>
    </table>
    <p>Please review and approve or reject this request in the admin panel.</p>
    <div style="text-align:center;margin:32px 0;">
      <a href="http://localhost:5173/admin/requests"
         style="background:#1565c0;color:#fff;padding:14px 32px;border-radius:6px;text-decoration:none;font-size:16px;font-weight:bold;">
        Review Request
      </a>
    </div>
    <p style="color:#888;font-size:12px;margin-top:32px;">MarathaKalyanam Admin Notification</p>
  </div>
</body>
</html>
