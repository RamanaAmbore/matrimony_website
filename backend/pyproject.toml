[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marathakalyanam-backend"
version = "1.0.0"
description = "Matrimonial site backend for Telugu-Maratha people"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard,cryptography]>=2.12.0",
    "cryptography>=42.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "msgspec>=0.18.6",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "argon2-cffi>=23.1.0",
    "aiosmtplib>=3.0.2",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "pyjwt[crypto]>=2.8.0",
    "uvicorn[standard]>=0.32.0",
    "aiofiles>=24.1.0",
    "psycopg2-binary>=2.9.10",
    "boto3>=1.35.0",  # S3-compatible client for Cloudflare R2 photo storage
    "weasyprint>=63.0",  # HTML/CSS → PDF for admin profile dossiers
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "anyio>=4.7.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.format]
quote-style = "double"
